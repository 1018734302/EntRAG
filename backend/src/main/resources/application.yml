server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: enterprise-rag
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enterprise_rag}
    username: ${DB_USER:rag}
    password: ${DB_PASSWORD:rag123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        format_sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  # Spring AI Alibaba 架构下的本地模型接入（Ollama）
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: qwen3:4b
      embedding:
        model: qwen3-embedding:4b
    vectorstore:
      pgvector:
        initialize-schema: true
        remove-existing-vector-store-table: false
        id-type: TEXT
        dimensions: 2560
        index-type: NONE
        distance-type: COSINE_DISTANCE

# 业务自定义配置
rag:
  chat:
    model: qwen3:4b
    top-k: 5
    temperature: 0.2
  embedding:
    dim: 2560
  chunk:
    size: 512
    overlap: 64
  jwt:
    secret: "Z2VoDW9lbnRyYWctc2VjcmV0LWtleS0yMDI2LXNwcmluZy1haS1hbGliYWJhLXJhZw=="
    expiration-ms: 86400000
  # 重排（Cross-Encoder）：
  #   enabled=false → 走「0.7*向量 + 0.3*关键词」线性融合（零额外开销）
  #   enabled=true  → 使用 Xinference + Qwen3-Reranker 重排；调用失败会自动降级回融合
  rerank:
    enabled: false
    base-url: "${RAG_RERANK_BASE_URL:http://localhost:9997}"
    model: "${RAG_RERANK_MODEL:Qwen3-Reranker-0.6B}"
    threshold: 0.0
    timeout-ms: 8000
  cors:
    allowed-origins: "${RAG_CORS_ALLOWED_ORIGINS:http://localhost:5173}"

logging:
  level:
    org.springframework.ai: INFO
    com.example.rag: DEBUG
